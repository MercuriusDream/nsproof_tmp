name: GPT56 NSProof source snapshot

on:
  push:
    branches:
      - gpt56-resume-nsproof-20260826
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Record provenance and pack source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nsproof-snapshot
          git rev-parse HEAD | tee /tmp/nsproof-snapshot/COMMIT_SHA.txt
          git status --short | tee /tmp/nsproof-snapshot/GIT_STATUS.txt
          python3 --version | tee /tmp/nsproof-snapshot/PYTHON_VERSION.txt
          tar \
            --exclude=.git \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            -czf /tmp/nsproof-snapshot/nsproof-src.tar.gz .
          sha256sum /tmp/nsproof-snapshot/nsproof-src.tar.gz | tee /tmp/nsproof-snapshot/SHA256SUMS
          tar -tzf /tmp/nsproof-snapshot/nsproof-src.tar.gz | wc -l | tee /tmp/nsproof-snapshot/ENTRY_COUNT.txt

      - name: Upload reproducible source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: nsproof-source-snapshot
          path: /tmp/nsproof-snapshot/
          if-no-files-found: error
          retention-days: 7
