name: GPT56 Assemble Definitive Resolution

on:
  push:
    branches:
      - gpt56-resume-nsproof-20260826
    paths:
      - '.gpt56_payload/**'
      - '.github/workflows/gpt56-assemble.yml'

permissions:
  contents: write

jobs:
  assemble-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble exact payload
        shell: bash
        run: |
          set -euo pipefail
          cat .gpt56_payload/chunk_*.txt > /tmp/nsproof_payload.b64
          printf '%s  %s\n' '7368e690bfb5c83a8465a1043781cfc062be6d05f6528eb7310ede748418aec4' '/tmp/nsproof_payload.b64' | sha256sum -c -
          base64 --decode /tmp/nsproof_payload.b64 > /tmp/nsproof_payload.tar.gz
          printf '%s  %s\n' 'cbcc89cb3b9124029242da723ce929b378047442d90dbcc6305504a0326ff31d' '/tmp/nsproof_payload.tar.gz' | sha256sum -c -
          tar -xzf /tmp/nsproof_payload.tar.gz

      - name: Replay branch-kill certificate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/validate_axisymmetric_subparabolic_obstruction.py tools/test_axisymmetric_subparabolic_obstruction.py
          python3 tools/validate_axisymmetric_subparabolic_obstruction.py | tee /tmp/branch-kill-validator.log
          python3 tools/test_axisymmetric_subparabolic_obstruction.py | tee /tmp/branch-kill-regression.log
          grep -q '^checks=10/10$' /tmp/branch-kill-validator.log
          grep -q '^branch_kill_pass=true$' /tmp/branch-kill-validator.log
          grep -q '^positive_theorem_pass=false$' /tmp/branch-kill-validator.log
          grep -q '^status=TARGET_CLASS_EMPTY$' /tmp/branch-kill-validator.log

      - name: Commit verified resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GPT-5.6 Pro proof audit'
          git config user.email 'proof-audit@users.noreply.github.com'
          git rm -r .gpt56_payload .github/workflows/gpt56-assemble.yml .github/workflows/gpt56-export.yml
          git add DEFINITIVE_RESOLUTION.md \
            tools/validate_axisymmetric_subparabolic_obstruction.py \
            tools/test_axisymmetric_subparabolic_obstruction.py \
            certs/obstructions/axisymmetric_subparabolic_no_go.json \
            certs/branch_kill_manifest.json
          git commit -m 'Certify exact no-go for smooth axisymmetric gamma<1/2 route'
          git push origin HEAD:gpt56-resume-nsproof-20260826
