name: Exact RP4 degree-sensitivity verification

on:
  push:
    branches:
      - degree-sensitivity-rp4-20260826
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-rp4:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Install GAP and simpcomp
        run: |
          sudo apt-get update
          sudo apt-get install -y gap gap-io gap-gapdoc git
          gap -q <<'EOF'
          Print("GAP_ROOTS=", GAPInfo.RootPaths, "\n");
          QUIT;
          EOF
          sudo mkdir -p /usr/share/gap/pkg
          sudo git clone --depth 1 https://github.com/simpcomp-team/simpcomp.git /usr/share/gap/pkg/simpcomp
          gap -q <<'EOF'
          if LoadPackage("simpcomp") <> true then Error("simpcomp failed to load"); fi;
          Print("SIMPCOMP_OK\n");
          QUIT;
          EOF

      - name: Execute exhaustive RP4 test
        run: python3 degree_sensitivity/rp4_exact.py

      - name: Upload exact artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: degree-sensitivity-rp4-exact
          path: degree_sensitivity/output/
          if-no-files-found: error
